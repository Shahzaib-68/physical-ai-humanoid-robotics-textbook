<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background Glow -->
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff" />
      <stop offset="100%" style="stop-color:#0088ff" />
    </linearGradient>
  </defs>
  
  <!-- Glow Effect -->
  <circle cx="200" cy="200" r="150" fill="url(#glow1)"/>
  
  <!-- Robot Head -->
  <rect x="140" y="120" width="120" height="140" rx="20" fill="#1a1f3a" stroke="#00ffff" stroke-width="3"/>
  
  <!-- Antenna -->
  <line x1="200" y1="120" x2="200" y2="80" stroke="#00ffff" stroke-width="3"/>
  <circle cx="200" cy="75" r="8" fill="#00ffff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eyes -->
  <circle cx="170" cy="160" r="15" fill="#00ffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="160" r="15" fill="#00ffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Brain Neural Network -->
  <g opacity="0.6">
    <circle cx="200" cy="210" r="35" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5">
      <animateTransform attributeName="transform" type="rotate" from="0 200 210" to="360 200 210" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Neural Nodes -->
    <circle cx="180" cy="200" r="4" fill="#00ffff"/>
    <circle cx="220" cy="200" r="4" fill="#00ffff"/>
    <circle cx="200" cy="230" r="4" fill="#00ffff"/>
    <circle cx="190" cy="220" r="4" fill="#00ffff"/>
    <circle cx="210" cy="220" r="4" fill="#00ffff"/>
    
    <!-- Neural Connections -->
    <line x1="180" y1="200" x2="220" y2="200" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
    <line x1="180" y1="200" x2="190" y2="220" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
    <line x1="220" y1="200" x2="210" y2="220" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
    <line x1="190" y1="220" x2="200" y2="230" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
    <line x1="210" y1="220" x2="200" y2="230" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Circuit Lines -->
  <path d="M 140 180 L 120 180 L 120 200 L 100 200" stroke="#00ffff" stroke-width="2" fill="none"/>
  <path d="M 260 180 L 280 180 L 280 200 L 300 200" stroke="#00ffff" stroke-width="2" fill="none"/>
  
  <!-- Circuit Dots -->
  <circle cx="100" cy="200" r="5" fill="#00ffff">
    <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="200" r="5" fill="#00ffff">
    <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Data Flow Lines -->
  <g opacity="0.6">
    <line x1="150" y1="280" x2="150" y2="320" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="280" x2="200" y2="320" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="280" x2="250" y2="320" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Base Platform -->
  <rect x="120" y="320" width="160" height="10" rx="5" fill="#1a1f3a" stroke="#00ffff" stroke-width="2"/>
</svg>