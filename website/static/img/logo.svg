<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cccc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Robot Head -->
  <rect x="15" y="8" width="20" height="18" rx="2" stroke="url(#robotGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
  
  <!-- Eyes -->
  <circle cx="21" cy="16" r="2.5" fill="#00ffff" filter="url(#glow)"/>
  <circle cx="29" cy="16" r="2.5" fill="#00ffff" filter="url(#glow)"/>
  
  <!-- Antenna -->
  <line x1="25" y1="8" x2="25" y2="4" stroke="url(#robotGradient)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="25" cy="3" r="2" fill="#00ffff" filter="url(#glow)"/>
  
  <!-- Mouth/Display -->
  <line x1="20" y1="22" x2="30" y2="22" stroke="url(#robotGradient)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Neck -->
  <line x1="25" y1="26" x2="25" y2="29" stroke="url(#robotGradient)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Body -->
  <rect x="17" y="29" width="16" height="12" rx="2" stroke="url(#robotGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
  
  <!-- Chest Circle (AI Core) -->
  <circle cx="25" cy="35" r="3" stroke="#00ffff" stroke-width="1.5" fill="none" filter="url(#glow)"/>
  <circle cx="25" cy="35" r="1.5" fill="#00ffff" filter="url(#glow)"/>
  
  <!-- Arms -->
  <line x1="17" y1="32" x2="12" y2="35" stroke="url(#robotGradient)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="33" y1="32" x2="38" y2="35" stroke="url(#robotGradient)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Hands -->
  <circle cx="11" cy="36" r="2" stroke="#00ffff" stroke-width="1.5" fill="none" filter="url(#glow)"/>
  <circle cx="39" cy="36" r="2" stroke="#00ffff" stroke-width="1.5" fill="none" filter="url(#glow)"/>
  
  <!-- Legs -->
  <line x1="21" y1="41" x2="21" y2="46" stroke="url(#robotGradient)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="29" y1="41" x2="29" y2="46" stroke="url(#robotGradient)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Feet -->
  <rect x="18" y="46" width="6" height="2" rx="1" fill="#00ffff" filter="url(#glow)"/>
  <rect x="26" y="46" width="6" height="2" rx="1" fill="#00ffff" filter="url(#glow)"/>
</svg>