# GitHub Actions Workflow for Deploying to GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # ✅ YEH SAHI HAI - CHANGE MAT KARO
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3

    - name: Setup Node.js 📦
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        # ✅ FIXED: Aapka actual path
        cache-dependency-path: 'physical-ai-humanoid-robotics-textbook/package-lock.json'

    - name: Install dependencies 📥
      run: |
        cd physical-ai-humanoid-robotics-textbook
        npm ci

    - name: Build 🏗️
      run: |
        cd physical-ai-humanoid-robotics-textbook
        npm run build

    - name: Deploy to GitHub Pages 🚀
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./physical-ai-humanoid-robotics-textbook/build
        # ✅ NO CNAME - Using GitHub subdomain